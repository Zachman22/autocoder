name: Build Release Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux Installers
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Install Qt6 and dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential \
            qt6-base-dev libqt6websockets6-dev \
            libssl-dev libcurl4-openssl-dev \
            rpm

      - name: Build project
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_INSTALLER=ON
          cmake --build . -j$(nproc)

      - name: Generate DEB package
        run: |
          cd build
          cpack -G DEB

      - name: Generate RPM package
        run: |
          cd build
          cpack -G RPM

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v3
        with:
          name: AutoCoder-Linux-DEB
          path: build/AutoCoder-*.deb

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v3
        with:
          name: AutoCoder-Linux-RPM
          path: build/AutoCoder-*.rpm

  build-macos:
    name: Build macOS Installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Qt6 and dependencies
        run: |
          brew install qt@6 openssl@3 curl cmake

      - name: Build project
        run: |
          export CMAKE_PREFIX_PATH="$(brew --prefix qt@6):$CMAKE_PREFIX_PATH"
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_INSTALLER=ON
          cmake --build . -j$(sysctl -n hw.ncpu)

      - name: Generate DMG package
        run: |
          cd build
          cpack -G DragNDrop

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v3
        with:
          name: AutoCoder-macOS-DMG
          path: build/AutoCoder-*.dmg

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg integrate install
          .\vcpkg install qt6:x64-windows openssl:x64-windows curl:x64-windows

      - name: Build project
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=..\vcpkg\scripts\buildsystems\vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_INSTALLER=ON
          cmake --build . --config Release

      - name: Generate NSIS installer
        run: |
          cd build
          cpack -C Release -G NSIS

      - name: Upload installer artifact
        uses: actions/upload-artifact@v3
        with:
          name: AutoCoder-Windows-Installer
          path: build/AutoCoder-*.exe

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            AutoCoder-Linux-DEB/*.deb
            AutoCoder-Linux-RPM/*.rpm
            AutoCoder-macOS-DMG/*.dmg
            AutoCoder-Windows-Installer/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
